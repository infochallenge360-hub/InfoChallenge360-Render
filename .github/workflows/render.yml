name: Render Episodes (Batch)

on:
  workflow_dispatch:
    inputs:
      jobs_json:
        description: >
          JSON array of jobs to render in parallel. Each item:
          {"command":"render"|"still","composition_id":"E33CostumeQuiz","output_name":"InfoChallenge360-E33-Costumes.mp4"}
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(inputs.jobs_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az /usr/lib/jvm
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chrome headless-shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm ci

      - name: Render or Still
        run: |
          mkdir -p out
          if [ "${{ matrix.job.command }}" = "still" ]; then
            npx remotion still src/index.js "${{ matrix.job.composition_id }}" "out/${{ matrix.job.output_name }}"
          else
            npx remotion render src/index.js "${{ matrix.job.composition_id }}" "out/${{ matrix.job.output_name }}" --concurrency=2
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job.output_name }}
          path: out/${{ matrix.job.output_name }}
          retention-days: 14

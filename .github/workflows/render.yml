name: Render Episode

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: "Remotion composition ID (e.g. E17DesertsQuiz, ThumbE17Deserts)"
        required: true
        type: string
      output_name:
        description: "Output filename (e.g. InfoChallenge360-E17-Deserts.mp4)"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chrome headless-shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm ci

      - name: Render
        run: npx remotion render src/index.js "${{ inputs.composition_id }}" "out/${{ inputs.output_name }}" --concurrency=2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: out/${{ inputs.output_name }}
          retention-days: 14
